[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-skeptic"
version = "0.1.0"
description = "Domain-agnostic ML/AI failure discovery, amplification and evidence harness (pmi)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14"]

[project.scripts]
pmi = "pmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmi = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
